<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Black Jack</title>
</head>
<body>
    <header class="titulo">Black Jack</header>

    <!-- botones -->
     <div class="row mt-2">
        <div id="divBotones" class="col text-center">
            <button id="btnNuevo" class="btn btn-primary">Nuevo Juego</button>
            <button id="btnPedir" class="btn btn-danger">Pedir Carta</button>
            <button id="btnDetener" class="btn btn-danger">Detener</button>
        </div>
     </div>

    <!-- cartas -->
    <div class="row container">
        <div class="col">
            <h1>Jugador 1 - <small>0</small></h1>
            <div id="jugador-cartas">
                <!-- Las cartas se agregarán aquí dinámicamente -->
            </div>
        </div>

    </div>

    <div class="row container">
        <div class="col">
            <h1>Computadora 1 - <small>0</small></h1>
            <div id="computadora-cartas">
                <!-- Las cartas se agregarán aquí dinámicamente -->
            </div>
            </div>
        </div>

    </div>

    <script src="assets/js/underscore.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
